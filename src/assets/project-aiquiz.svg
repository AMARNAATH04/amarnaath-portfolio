<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#aiGrad)" />

  <g transform="translate(60, 40)">
    <!-- Quiz Interface Card -->
    <rect width="680" height="420" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Top Ribbon -->
    <rect width="680" height="50" rx="14" fill="#1e293b" />
    <text x="30" y="32" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14">INTER-COLLEGE AI COMPETITION</text>
    
    <!-- Award Badge -->
    <g transform="translate(520, 10)">
      <rect width="130" height="30" rx="15" fill="url(#silverGrad)" />
      <text x="65" y="20" fill="#0f172a" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" text-anchor="middle">🏆 2ND PLACE WINNER</text>
    </g>

    <!-- Question Box -->
    <g transform="translate(30, 80)">
      <rect width="620" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="25" y="35" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Question: Which heuristic search algorithm guarantees optimal path in AI state spaces?</text>
      <text x="25" y="65" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12">Category: Artificial Intelligence &amp; Search Strategies | Round 3</text>

      <!-- Option 1 -->
      <rect y="110" width="295" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="142" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">A. Depth-First Greedy Search</text>

      <!-- Option 2 (Correct/Selected) -->
      <rect x="325" y="110" width="295" height="55" rx="8" fill="#065f46" stroke="#10b981" stroke-width="2" />
      <text x="345" y="142" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">B. A* Search (Admissible Heuristic) ✓</text>

      <!-- Option 3 -->
      <rect y="180" width="295" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="212" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">C. Uniform Random Walk</text>

      <!-- Option 4 -->
      <rect x="325" y="180" width="295" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="345" y="212" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">D. Minimax without Pruning</text>

      <!-- Performance Footer -->
      <g transform="translate(0, 260)">
        <rect width="620" height="50" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="30" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13">Score: 94/100</text>
        <text x="200" y="30" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Participant: AMARNAATH N T</text>
        <text x="440" y="30" fill="#10b981" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Rank: 2nd Position Overall</text>
      </g>
    </g>
  </g>
</svg>
