    <!-- Code Pane -->
    <g transform="translate(30, 65)">
      <!-- Line numbers -->
      <text x="0" y="20" fill="#484f58" font-family="'Courier New', monospace" font-size="12">01</text>
      <text x="0" y="45" fill="#484f58" font-family="'Courier New', monospace" font-size="12">02</text>
      <text x="0" y="70" fill="#484f58" font-family="'Courier New', monospace" font-size="12">03</text>
      <text x="0" y="95" fill="#484f58" font-family="'Courier New', monospace" font-size="12">04</text>
