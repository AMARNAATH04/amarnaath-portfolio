      <text x="0" y="245" fill="#484f58" font-family="'Courier New', monospace" font-size="12">10</text>

      <!-- Code content -->
      <g transform="translate(35, 0)">
        <text x="0" y="20" fill="#ff7b72" font-family="'Courier New', monospace" font-size="12">public class <tspan fill="#79c0ff">BinarySearchTree&lt;T extends Comparable&lt;T&gt;&gt;</tspan> {</text>
        <text x="20" y="45" fill="#ff7b72" font-family="'Courier New', monospace" font-size="12">private <tspan fill="#d2a8ff">Node&lt;T&gt;</tspan> <tspan fill="#c9d1d9">root;</tspan></text>
        <text x="20" y="70" fill="#8b949e" font-family="'Courier New', monospace" font-size="12">// Balanced insertion with logarithmic complexity O(log N)</text>
        <text x="20" y="95" fill="#ff7b72" font-family="'Courier New', monospace" font-size="12">public void <tspan fill="#d2a8ff">insert</tspan>(<tspan fill="#79c0ff">T</tspan> <tspan fill="#c9d1d9">val</tspan>) {</text>
        <text x="40" y="120" fill="#c9d1d9" font-family="'Courier New', monospace" font-size="12">root = insertRec(root, val);</text>
        <text x="20" y="145" fill="#c9d1d9" font-family="'Courier New', monospace" font-size="12">}</text>
        <text x="20" y="170" fill="#8b949e" font-family="'Courier New', monospace" font-size="12">// Validated across Infosys &amp; NPTEL assessments</text>
        <text x="20" y="195" fill="#ff7b72" font-family="'Courier New', monospace" font-size="12">public boolean <tspan fill="#d2a8ff">search</tspan>(<tspan fill="#79c0ff">T</tspan> <tspan fill="#c9d1d9">target</tspan>) {</text>
        <text x="40" y="220" fill="#ff7b72" font-family="'Courier New', monospace" font-size="12">return <tspan fill="#79c0ff">searchRec</tspan>(root, target);</text>
        <text x="20" y="245" fill="#c9d1d9" font-family="'Courier New', monospace" font-size="12">}</text>
      </g>
    </g>

