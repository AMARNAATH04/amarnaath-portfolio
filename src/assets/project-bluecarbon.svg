<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0e3048" />
      <stop offset="100%" stop-color="#0d4a58" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a3a" />
      <stop offset="100%" stop-color="#101c27" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5a3" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#oceanGrad)" />

  <!-- Browser Window Frame Mockup -->
  <g transform="translate(40, 30)">
    <!-- Browser Top Bar -->
    <rect width="720" height="440" rx="12" fill="#0b131c" stroke="#1f3347" stroke-width="2" />
    <path d="M 0,12 A 12,12 0 0,1 12,0 L 708,0 A 12,12 0 0,1 720,12 L 720,40 L 0,40 Z" fill="#14202e" />
    
    <!-- Window Controls -->
    <circle cx="25" cy="20" r="5" fill="#ef4444" />
    <circle cx="45" cy="20" r="5" fill="#f59e0b" />
    <circle cx="65" cy="20" r="5" fill="#10b981" />
    
    <!-- Browser Search Bar -->
    <rect x="100" y="10" width="360" height="20" rx="5" fill="#0b131c" stroke="#22374d" stroke-width="1" />
    <text x="115" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">https://blue-carbon-mrv.ecosystem/dashboard</text>

    <!-- App Header -->
    <rect x="0" y="40" width="720" height="45" fill="#0f1b27" stroke="#1f3347" stroke-width="1" />
    <circle cx="30" cy="62" r="10" fill="#00e5a3" />
    <text x="50" y="66" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13">BLUE CARBON MRV SYSTEM</text>
    <text x="560" y="65" fill="#00e5a3" font-family="'Inter', sans-serif" font-size="11">● Monitoring Live</text>

    <!-- Sidebar -->
    <rect x="0" y="85" width="140" height="355" fill="#0b141e" />
    <rect x="15" y="105" width="110" height="24" rx="4" fill="#1f3a52" />
    <text x="25" y="121" fill="#00e5a3" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Dashboard</text>
    <text x="25" y="155" fill="#8197aa" font-family="'Inter', sans-serif" font-size="11">Mangroves</text>
    <text x="25" y="185" fill="#8197aa" font-family="'Inter', sans-serif" font-size="11">Seagrass Beds</text>
    <text x="25" y="215" fill="#8197aa" font-family="'Inter', sans-serif" font-size="11">Salt Marshes</text>
    <text x="25" y="245" fill="#8197aa" font-family="'Inter', sans-serif" font-size="11">Verification</text>
    <text x="25" y="275" fill="#8197aa" font-family="'Inter', sans-serif" font-size="11">Reports &amp; PDF</text>

    <!-- Main Content Area -->
    <!-- Metric Cards -->
    <g transform="translate(160, 105)">
      <!-- Card 1 -->
      <rect width="165" height="75" rx="8" fill="url(#cardGrad)" stroke="#1e3447" stroke-width="1" />
      <text x="15" y="25" fill="#8197aa" font-family="'Inter', sans-serif" font-size="10">TOTAL CO₂ SEQUESTERED</text>
      <text x="15" y="52" fill="#00e5a3" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800">42,850 t</text>
      <text x="15" y="68" fill="#10b981" font-family="'Inter', sans-serif" font-size="9">↑ +14.2% YoY Gain</text>

      <!-- Card 2 -->
      <rect x="180" width="165" height="75" rx="8" fill="url(#cardGrad)" stroke="#1e3447" stroke-width="1" />
      <text x="195" y="25" fill="#8197aa" font-family="'Inter', sans-serif" font-size="10">VERIFIED HABITAT</text>
      <text x="195" y="52" fill="#38bdf8" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800">1,240 Ha</text>
      <text x="195" y="68" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9">3 Active Coastal Zones</text>

      <!-- Card 3 -->
      <rect x="360" width="175" height="75" rx="8" fill="url(#cardGrad)" stroke="#1e3447" stroke-width="1" />
      <text x="375" y="25" fill="#8197aa" font-family="'Inter', sans-serif" font-size="10">MRV COMPLIANCE</text>
      <text x="375" y="52" fill="#facc15" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800">99.4%</text>
      <text x="375" y="68" fill="#facc15" font-family="'Inter', sans-serif" font-size="9">Verified by Protocol</text>
    </g>

    <!-- Chart & Map Visualization Section -->
    <g transform="translate(160, 200)">
      <!-- Left Chart Card -->
      <rect width="320" height="215" rx="8" fill="#12202e" stroke="#1f364a" stroke-width="1" />
      <text x="15" y="25" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600">Carbon Biomass Density (t/ha)</text>
      
      <!-- Chart line and grid -->
      <line x1="25" y1="180" x2="300" y2="180" stroke="#22384c" stroke-width="1" />
      <line x1="25" y1="140" x2="300" y2="140" stroke="#22384c" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="25" y1="100" x2="300" y2="100" stroke="#22384c" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="25" y1="60" x2="300" y2="60" stroke="#22384c" stroke-width="1" stroke-dasharray="3,3" />

      <!-- Area fill path -->
      <path d="M 30,170 Q 80,120 130,140 T 210,90 T 290,70 L 290,180 L 30,180 Z" fill="url(#tealGrad)" opacity="0.25" />
      <!-- Line path -->
      <path d="M 30,170 Q 80,120 130,140 T 210,90 T 290,70" fill="none" stroke="#00e5a3" stroke-width="3" />

      <circle cx="130" cy="140" r="4" fill="#00e5a3" />
      <circle cx="210" cy="90" r="4" fill="#00e5a3" />
      <circle cx="290" cy="70" r="5" fill="#ffffff" stroke="#00e5a3" stroke-width="2" />

      <!-- Right Verification Status Box -->
      <rect x="340" width="195" height="215" rx="8" fill="#12202e" stroke="#1f364a" stroke-width="1" />
      <text x="355" y="25" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600">Verification Feed</text>
      
      <circle cx="360" cy="60" r="6" fill="#10b981" />
      <text x="375" y="64" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Satellite imagery ingested</text>
      
      <circle cx="360" cy="100" r="6" fill="#10b981" />
      <text x="375" y="104" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Mangrove canopy audited</text>

      <circle cx="360" cy="140" r="6" fill="#00e5a3" />
      <text x="375" y="144" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Biomass calculations validated</text>

      <rect x="355" y="170" width="165" height="30" rx="5" fill="#ff5232" />
      <text x="437" y="189" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Generate MRV Report</text>
    </g>
  </g>
</svg>
