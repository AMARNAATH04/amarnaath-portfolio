<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="gaugeGlow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a404d" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#14161a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0c0e" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5232" />
      <stop offset="100%" stop-color="#ff7b25" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gaugeGlow)" />

  <!-- Speedometer / Precision Gauge Dial Art matching reference -->
  <g transform="translate(480, 280)" opacity="0.35">
    <!-- Dial circle rings -->
    <circle r="180" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />
    <circle r="160" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,8" stroke-opacity="0.3" />
    <circle r="130" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

    <!-- Gauge tick marks -->
    <g stroke="#ffffff" stroke-width="2" stroke-opacity="0.5">
      <line x1="0" y1="-160" x2="0" y2="-145" />
      <line x1="113" y1="-113" x2="102" y2="-102" />
      <line x1="160" y1="0" x2="145" y2="0" />
      <line x1="113" y1="113" x2="102" y2="102" />
      <line x1="0" y1="160" x2="0" y2="145" />
      <line x1="-113" y1="113" x2="-102" y2="102" />
      <line x1="-160" y1="0" x2="-145" y2="0" />
      <line x1="-113" y1="-113" x2="-102" y2="-102" />
    </g>

    <!-- Glowing active arc -->
    <path d="M -160,0 A 160,160 0 1,1 113,-113" fill="none" stroke="url(#needleGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75" />

    <!-- Center pin -->
    <circle r="14" fill="#242730" stroke="#ff5232" stroke-width="3" />
  </g>

  <!-- Tech bokeh circles -->
  <circle cx="150" cy="180" r="45" fill="#ffffff" opacity="0.04" />
  <circle cx="280" cy="420" r="70" fill="#ffffff" opacity="0.03" />
  <circle cx="680" cy="120" r="30" fill="#ff7b25" opacity="0.06" />

  <!-- Dark overlay to ensure text contrast -->
  <rect width="800" height="600" fill="#000000" opacity="0.45" />
</svg>
